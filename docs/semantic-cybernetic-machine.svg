<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#67e8f9"/></marker>
  <style>
    .t{font-family:Inter,Arial,sans-serif;fill:#e5e7eb}.h{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#fff}.s{font-family:Inter,Arial,sans-serif;font-size:20px;fill:#94a3b8}
    .box{fill:#0f172a;stroke:#334155;stroke-width:2}.cyan{stroke:#67e8f9}.violet{stroke:#a78bfa}.green{stroke:#6ee7b7}.amber{stroke:#fbbf24}
    .flow{fill:none;stroke:#67e8f9;stroke-width:4;marker-end:url(#arrow)} .soft{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 8}
  </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="800" y="62" text-anchor="middle" class="h" font-size="38">SEMIO-CYBERNETIC MACHINE</text>
<text x="800" y="98" text-anchor="middle" class="s">Intent → Router → MicroDomain → Opcode → Kernel → Engine → State → Feedback</text>

<!-- intent -->
<rect x="55" y="410" width="220" height="130" rx="22" class="box cyan"/>
<text x="165" y="455" text-anchor="middle" class="h" font-size="27">INTENTO</text>
<text x="165" y="490" text-anchor="middle" class="s">sign / prompt / agent</text>
<text x="165" y="518" text-anchor="middle" class="s">wallet / proposal</text>

<!-- router -->
<rect x="330" y="350" width="230" height="250" rx="30" class="box violet"/>
<circle cx="445" cy="420" r="45" fill="url(#core)" stroke="#a78bfa" stroke-width="3"/>
<circle cx="445" cy="420" r="10" fill="#a78bfa" filter="url(#glow)"/>
<path d="M445 375V465 M400 420H490" stroke="#a78bfa" stroke-width="3"/>
<text x="445" y="505" text-anchor="middle" class="h" font-size="27">SEMANTIC ROUTER</text>
<text x="445" y="540" text-anchor="middle" class="s">intent → address → capability</text>

<!-- microdomain -->
<rect x="620" y="250" width="330" height="450" rx="34" class="box cyan"/>
<text x="785" y="292" text-anchor="middle" class="h" font-size="30">NFT · MICRODOMAIN</text>
<text x="785" y="326" text-anchor="middle" class="s">addressable semantic atom</text>
<rect x="660" y="360" width="250" height="62" rx="14" fill="#111827" stroke="#67e8f9" stroke-width="2"/>
<text x="785" y="400" text-anchor="middle" class="h" font-size="22">ADDRESS / ID</text>
<rect x="660" y="440" width="250" height="62" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
<text x="785" y="480" text-anchor="middle" class="h" font-size="22">SEMANTICS / STATE</text>
<rect x="660" y="520" width="250" height="62" rx="14" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
<text x="785" y="560" text-anchor="middle" class="h" font-size="22">OPCODE / RULES</text>
<rect x="660" y="600" width="250" height="62" rx="14" fill="#111827" stroke="#6ee7b7" stroke-width="2"/>
<text x="785" y="640" text-anchor="middle" class="h" font-size="22">ROUTER / PERMISSIONS</text>

<!-- kernel -->
<rect x="1010" y="350" width="230" height="250" rx="30" class="box amber"/>
<text x="1125" y="405" text-anchor="middle" class="h" font-size="29">META-KERNEL</text>
<text x="1125" y="445" text-anchor="middle" class="s">semantic kernel</text>
<text x="1125" y="477" text-anchor="middle" class="s">cognitive kernel</text>
<text x="1125" y="509" text-anchor="middle" class="s">economic kernel</text>
<text x="1125" y="541" text-anchor="middle" class="s">governance kernel</text>

<!-- engine -->
<rect x="1300" y="330" width="240" height="290" rx="30" class="box green"/>
<text x="1420" y="390" text-anchor="middle" class="h" font-size="30">ENGINE</text>
<text x="1420" y="425" text-anchor="middle" class="s">oracle / VM / agent</text>
<text x="1420" y="455" text-anchor="middle" class="s">simulation / valuation</text>
<text x="1420" y="485" text-anchor="middle" class="s">composition / action</text>
<text x="1420" y="545" text-anchor="middle" class="h" font-size="24">STATE → STATE′</text>

<!-- flows -->
<path d="M275 475H330" class="flow"/>
<path d="M560 475H620" class="flow"/>
<path d="M950 475H1010" class="flow"/>
<path d="M1240 475H1300" class="flow"/>

<!-- feedback -->
<path d="M1420 620 C1420 790 500 850 445 610" class="flow"/>
<text x="1000" y="815" text-anchor="middle" class="h" font-size="25">FEEDBACK · LEARNING · ADAPTATION</text>

<!-- composition cloud -->
<rect x="610" y="760" width="350" height="155" rx="24" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
<text x="785" y="800" text-anchor="middle" class="h" font-size="24">COMPOSABILITY</text>
<text x="785" y="835" text-anchor="middle" class="s">NFT₁ ⊕ NFT₂ ⊕ NFT₃</text>
<text x="785" y="870" text-anchor="middle" class="s">→ molecule → protocol → ecosystem</text>

<!-- legend -->
<text x="55" y="965" class="s">Compilatorum · Semantic Virtual Machine · experimental architecture</text>
<text x="1545" y="965" text-anchor="end" class="s">v0.1 · 2026</text>
</svg>